services:
    nginx:
        image: "nginx:stable-alpine"
        ports:
            # 8100/8180 вместо стандартных 8000/8080: порты освобождены
            # под параллельно поднимаемый второй docker-проект.
            - "8100:80"
        restart: unless-stopped
        volumes:
            - ./dockerfiles/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - .:/var/www/laravel
        depends_on:
            - db
            - php
        networks:
            - seizure

    php:
        build:
            context: dockerfiles
            dockerfile: php.Dockerfile
        restart: unless-stopped
        volumes:
            - .:/var/www/laravel
            # Laravel writes logs to storage/logs/laravel.log; fluent-bit reads from
            # /var/log/laravel/laravel.log (see dockerfiles/fluent-bit/fluent-bit.conf).
            # Bind-mounting the same dir into two containers keeps ownership simple.
            - ./storage/logs:/var/www/laravel/storage/logs
            - ./storage/logs:/var/log/laravel
        networks:
            - seizure

    # Воркер database-очереди (QUEUE_CONNECTION=database): локальный аналог
    # supervisor-а прода. queue:restart не нужен — код монтируется, при
    # деплое контейнер перезапускается руками (docker compose up -d queue).
    queue:
        build:
            context: dockerfiles
            dockerfile: php.Dockerfile
        restart: unless-stopped
        volumes:
            - .:/var/www/laravel
        networks:
            - seizure
        depends_on:
            - db
        command: ["php", "/var/www/laravel/artisan", "queue:work", "database", "--sleep=3", "--tries=3"]


    db:
        image: mariadb
        ports:
            # 3326: 3306 занят MySQL из OSPanel, 3316 — конвенциональный
            # обходной порт других проектов; этот стек живёт на своём.
            - "3326:3306"
        restart: unless-stopped
        env_file:
            - .env
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_ALLOW_EMPTY_PASSWORD: YES
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - seizure
        command:
          - --max_allowed_packet=1G
          - --innodb_buffer_pool_size=2G
          - --innodb_log_file_size=512M

    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        ports:
            - 8180:80
        links:
            - db
        depends_on:
            - db
        restart: unless-stopped
        environment:
            PMA_HOST: db
            PMA_USER: ${DB_USERNAME}
            PMA_PASSWORD: ${DB_PASSWORD}
            PMA_ARBITRARY: 1
            UPLOAD_LIMIT: 640M
        networks:
            - seizure

    node:
        image: node:22-alpine
        working_dir: /var/www/laravel
        volumes:
            - .:/var/www/laravel
        networks:
            - seizure

    composer:
        build:
            context: dockerfiles
            dockerfile: composer.Dockerfile
        volumes:
            - .:/var/www/laravel
        networks:
            - seizure

    artisan:
        build:
            context: dockerfiles
            dockerfile: php.Dockerfile
        volumes:
            - .:/var/www/laravel
        networks:
            - seizure
        entrypoint: ["php", "/var/www/laravel/artisan"]

    # Profile: tools — one-shot runners used by humans or by agents
    # after implementing a feature. Started with:
    #   docker compose --profile tools run --rm phpunit
    #   docker compose --profile tools run --rm npm
    phpunit:
        profiles: ["tools"]
        build:
            context: dockerfiles
            dockerfile: php.Dockerfile
        volumes:
            - .:/var/www/laravel
        networks:
            - seizure
        working_dir: /var/www/laravel
        entrypoint: ["php", "vendor/bin/phpunit"]
        depends_on:
            - db

    npm:
        profiles: ["tools"]
        image: node:22-alpine
        working_dir: /var/www/laravel
        volumes:
            - .:/var/www/laravel
        networks:
            - seizure
        entrypoint: ["npm"]

    # Profile: logs — EFK (Elasticsearch + Fluent Bit + Kibana) for app log shipping.
    # Started explicitly with:
    #   docker compose --profile logs up -d
    # then open Kibana on http://127.0.0.1:5601 (NOT 0.0.0.0 — only loopback is exposed).
    elasticsearch:
        profiles: ["logs"]
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        restart: unless-stopped
        environment:
            # Keep ES under ~256m heap so it starts on lean dev boxes.
            ES_JAVA_OPTS: "-Xms256m -Xmx256m"
            # Bootstrap checks would refuse dev settings; disable for local-only.
            discovery.type: single-node
            xpack.security.enabled: "false"
            cluster.routing.allocation.disk.threshold_enabled: "false"
        ulimits:
            memlock:
                soft: -1
                hard: -1
        volumes:
            - es_data:/usr/share/elasticsearch/data
            - ./dockerfiles/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        networks:
            - seizure

    kibana:
        profiles: ["logs"]
        image: docker.elastic.co/kibana/kibana:8.13.4
        restart: unless-stopped
        # Bind only to loopback so Kibana is not reachable from LAN.
        ports:
            - "127.0.0.1:5601:5601"
        environment:
            ELASTICSEARCH_HOSTS: http://elasticsearch:9200
        volumes:
            - ./dockerfiles/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
        depends_on:
            elasticsearch:
                condition: service_healthy
        networks:
            - seizure

    fluent-bit:
        profiles: ["logs"]
        image: fluent/fluent-bit:3.1.0
        restart: unless-stopped
        # fluent-bit must see laravel.log at the same path configured in fluent-bit.conf.
        volumes:
            - ./dockerfiles/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
            - ./dockerfiles/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
            - ./storage/logs:/var/log/laravel:ro
            - fb_data:/var/lib/fluent-bit
        depends_on:
            elasticsearch:
                condition: service_healthy
        networks:
            - seizure

volumes:
    db_data:
    es_data:
    fb_data:

networks:
    seizure:
        driver: bridge
