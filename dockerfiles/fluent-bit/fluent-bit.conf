# Fluent Bit: tail Laravel's Monolog file and push to Elasticsearch.
# Parses Monolog's "[2024-05-12T10:11:12.123456+00:00] channel.LEVEL: message {"json":...}"
# line format into structured fields, then ships each record to ES.
#
# @SERVICE input:    tail the laravel.log file mounted from the host php container's perspective.
# @PARSER:           laravel   - regex split of the Monolog line into time / level / channel / msg.
# @FILTER:           nest the trailing JSON (if any) under a `context` object.
# @OUTPUT:           elasticsearch on http://elasticsearch:9200, daily index `laravel-YYYY.MM.DD`.

[SERVICE]
    Flush        5
    Daemon       off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/laravel/laravel.log
    Refresh_Interval  5
    Read_from_Head    true
    Parser            laravel
    Tag               laravel.app
    DB                /var/lib/fluent-bit/positions.db

[FILTER]
    Name    grep
    Match   laravel.app
    Regex   log_level ^(DEBUG|INFO|NOTICE|WARNING|ERROR|CRITICAL|ALERT|EMERGENCY)$

[FILTER]
    Name    nest
    Match   laravel.app
    Operation   lift
    Nested_under context_json
    Add_prefix context.

[OUTPUT]
    Name            es
    Match           laravel.app
    Host            elasticsearch
    Port            9200
    Index           laravel
    Type            _doc
    Time_Key        @timestamp
    Time_Key_Format iso8601
    Include_Tag_Key true
    Tag_Key         fluent_tag
    # Replay-friendly: replace the document if Laravel somehow re-emits the same id.
    Generate_ID     off
    # Don't fail the pipeline if ES is briefly unreachable.
    Retry_Limit     3
