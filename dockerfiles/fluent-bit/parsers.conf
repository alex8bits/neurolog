# Regex parser for Monolog's default line format.
# Default Monolog LineFormatter produces:
#   [2024-05-12T10:11:12.123456+00:00] local.ERROR: Something failed {"foo":"bar"}
# We capture: time, channel, log_level, message, and an optional trailing JSON blob (context_json).
# Reference: https://github.com/Seldaek/monolog/blob/main/src/Monolog/Formatter/LineFormatter.php

[PARSER]
    Name        laravel
    Format      regex
    Regex       ^\[(?<time>[^\]]+)\]\s+(?<channel>[^.]+)\.(?<log_level>[^:]+):\s+(?<message>.*?)(?:\s+(?<context_json>\{.*\}))?\s*$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
